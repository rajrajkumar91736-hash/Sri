  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #f6f2ff;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 12px 16px 42px;
      color: #131c2b;
      background:
        radial-gradient(ellipse 43% 35% at 52% 32%, rgba(255,255,255,.85), transparent 100%),
        linear-gradient(120deg, #f2eeff 0%, #f8f5ff 54%, #f0edff 100%);
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .card {
      width: 100%;
      max-width: 555px;
      min-height: 584px;
      background: #fff;
      border-radius: 39px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 77px 36px 22px;
    }

    .logo {
      display: block;
      width: 164px;
      height: 159px;
      object-fit: contain;
    }

    h1 {
      font-size: 46px;
      font-weight: 700;
      letter-spacing: -.8px;
      line-height: 1.13;
      margin: 31px 0 9px;
      white-space: nowrap;
    }

    .amount-label {
      font-size: 37px;
      font-weight: 400;
      line-height: 1.2;
      margin: 0 0 3px;
    }

    .amount {
      font-size: 55px;
      line-height: 1.15;
      font-weight: 750;
      letter-spacing: -.8px;
      margin: 0 0 28px;
    }

    .download-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100px;
      padding: 14px 16px;
      border: 0;
      border-radius: 38px;
      color: #fff;
      background: #21a64e;
      font-size: 37px;
      font-weight: 700;
      line-height: 1.2;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
      transition: background-color .15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .download-btn:hover {
      background: #1b9444;
    }

    .download-btn:focus-visible {
      outline: 3px solid #123f24;
      outline-offset: 4px;
    }

    @media (max-width: 620px) {
      body {
        padding: 16px 16px 40px;
      }

      .card {
        min-height: 0;
        border-radius: 30px;
        padding: 46px 22px 22px;
      }

      .logo {
        width: 136px;
        height: 132px;
      }

      h1 {
        font-size: clamp(28px, 7.5vw, 39px);
        margin: 23px 0 9px;
      }

      .amount-label {
        font-size: clamp(22px, 6vw, 32px);
      }

      .amount {
        font-size: clamp(40px, 11.5vw, 50px);
        margin-bottom: 27px;
      }

      .download-btn {
        min-height: 72px;
        border-radius: 28px;
        font-size: clamp(22px, 6vw, 31px);
      }
    }

    @media (max-width: 350px) {
      .card {
        padding-left: 15px;

      h1 {

      }

<body>

  <main class="card" aria-labelledby="page-heading">

    <img
      class="logo"
      src="sridevilogo.png"
      alt="SD — SRIDEVI logo"
      width="164"
      height="159"
    />

    <h1 id="page-heading">SRIDEVI</h1>

    <p class="amount-label">Minimum Amount</p>

    <p class="amount">₹100/-</p>

    <a
      id="download-app"
      class="download-btn"
      href="https://shridevi.shop/app/shridevi.apk"
      aria-label="Download SRIDEVI Android app"
    >
      Download App
    </a>

  </main>

  <!-- Subscribe Event -->
  <script>
  (function () {
    var downloadLink = document.getElementById('download-app');

    if (!downloadLink) return;

    downloadLink.addEventListener('click', function () {
      if (typeof window.fbq === 'function') {
        window.fbq('track', 'Subscribe');
      }
    });
  }());
  </script>

</body>
</html>
